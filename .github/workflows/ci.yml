name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra mcp --frozen
      - run: uv run --extra dev --extra mcp python scripts/verify.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          python-version: '3.13'
      - run: uv sync --extra dev --frozen
      - run: uv run playwright install --with-deps chromium firefox webkit
      - run: uv run --extra dev pytest -q -m browser
        env:
          XHH_RUN_BROWSER_TESTS: '1'
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -t xiaoheihe-cli:validation .
      - run: docker run --rm --network none xiaoheihe-cli:validation xiaoheihe --help
      - run: docker run --rm --network none --mount type=volume,dst=/app/session xiaoheihe-cli:validation python scripts/container_smoke.py
